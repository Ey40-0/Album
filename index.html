<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!--
      Nota: <meta http-equiv="Content-Security-Policy"> no soporta directivas como frame-ancestors,
      report-uri ni sandbox; el control de embed en iframes requiere cabeceras HTTP del servidor.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://qarraqwopmytcnfwlcmv.supabase.co blob: data:; connect-src https://qarraqwopmytcnfwlcmv.supabase.co; font-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none';"
    />
    <title>Álbum privado — Iniciar sesión</title>
    <link rel="stylesheet" href="css/base.css" />
    <script src="js/vendor/supabase.js" defer></script>
    <script type="module" src="js/auth.js"></script>
  </head>
  <body>
    <main id="login-main" class="login-page" hidden>
      <section class="login-card" aria-labelledby="login-title">
        <header class="login-header">
          <h1 id="login-title">Álbum privado</h1>
          <p>Inicia sesión para entrar al álbum.</p>
        </header>

        <form id="login-form" class="login-form" novalidate>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              inputmode="email"
              required
            />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <p
            id="login-feedback"
            class="status-message"
            role="status"
            aria-live="polite"
            aria-atomic="true"
            hidden
          ></p>

          <button id="login-submit" type="submit" class="btn btn-primary">Entrar</button>
        </form>
      </section>
    </main>
  </body>
</html>
