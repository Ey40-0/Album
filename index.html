<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!--
      Nota: <meta http-equiv="Content-Security-Policy"> no soporta directivas como frame-ancestors,
      report-uri ni sandbox; el control de embed en iframes requiere cabeceras HTTP del servidor.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https://qarraqwopmytcnfwlcmv.supabase.co blob: data:; connect-src https://qarraqwopmytcnfwlcmv.supabase.co; font-src 'self' https://fonts.gstatic.com data:; form-action 'self'; base-uri 'self'; object-src 'none';"
    />
    <title>Iniciar sesión — Álbum privado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Pacifico&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="shortcut icon" href="assets/Heart.ico" type="image/x-icon" />
    <script src="js/vendor/supabase.js" defer></script>
    <script type="module" src="js/auth.js"></script>
  </head>
  <body class="sketch-body">
    <main id="login-main" class="login-page" hidden>
      <section class="login-card sketch-box" aria-labelledby="login-title">
        <!-- Corazón dibujado a mano con tramado (estilo boceto) -->
        <div class="login-corner-heart" aria-hidden="true">
          <svg class="sketch-heart-svg" viewBox="0 0 80 75" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M40 66C37 62 10 43 9 24C8 12 18 6 27 8C34 9 38 16 40 21C42 16 47 8 55 8C64 8 72 15 71 26C70 44 43 62 40 66Z"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <!-- Rayitas de relleno tipo lápiz/bolígrafo rojo -->
            <path
              d="M16 20L26 11M14 29L33 12M17 36L38 18M21 42L49 14M26 47L60 13M31 53L67 18M36 58L68 27M40 62L63 40"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              opacity="0.75"
            />
          </svg>
        </div>

        <header class="login-header">
          <span class="sketch-eyebrow">Con mucho amor</span>
          <h1 id="login-title" class="login-title">Álbum privado</h1>
          <svg class="sketch-underline" viewBox="0 0 220 12" fill="none" aria-hidden="true">
            <path
              d="M4 7C58 2 152 10 216 5"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            />
          </svg>
          <p class="login-subtitle">Inicia sesión para abrir nuestros recuerdos.</p>
        </header>

        <form id="login-form" class="login-form" novalidate>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input
              id="email"
              name="email"
              type="email"
              class="sketch-input"
              placeholder="tu@correo.com"
              autocomplete="username"
              inputmode="email"
              required
            />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              class="sketch-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
          </div>

          <p
            id="login-feedback"
            class="status-message sketch-status"
            role="status"
            aria-live="polite"
            aria-atomic="true"
            hidden
          ></p>

          <button id="login-submit" type="submit" class="btn btn-primary sketch-btn">
            <span>Entrar al álbum</span>
            <svg class="btn-heart-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 20.5C10.5 19 3.5 13.8 3.5 8.2C3.5 5.2 6 3.5 8.5 3.5C10.2 3.5 11.4 4.5 12 5.8C12.6 4.5 13.8 3.5 15.5 3.5C18 3.5 20.5 5.2 20.5 8.2C20.5 13.8 13.5 19 12 20.5Z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </form>

        <!-- Gatito dibujado a mano en la esquina inferior del login -->
        <div class="login-cat-doodle" aria-hidden="true">
          <svg class="sketch-cat-mini" viewBox="0 0 120 110" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Orejas y cabeza -->
            <path
              d="M32 45L28 18L48 30C55 28 65 28 72 30L92 18L88 45"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <!-- Detalles orejas -->
            <path d="M33 36L32 24L42 31" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M87 36L88 24L78 31" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <!-- Ojos y nariz -->
            <circle cx="48" cy="46" r="2.2" fill="currentColor" />
            <circle cx="72" cy="46" r="2.2" fill="currentColor" />
            <path d="M57 52C58.5 54 60 54 60 52C60 54 61.5 54 63 52" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <!-- Bigotes -->
            <path d="M30 48L18 46M30 53L16 53M31 58L19 61" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M90 48L102 46M90 53L104 53M89 58L101 61" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <!-- Cuerpo sentado y patitas -->
            <path d="M34 56C26 70 27 88 32 98" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            <path d="M86 56C93 70 92 88 87 98" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            <path d="M43 98C43 91 49 91 49 98" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M71 98C71 91 77 91 77 98" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <!-- Cola curva -->
            <path d="M89 92C102 84 106 58 112 48C115 44 118 47 115 53C111 63 107 88 92 97" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </div>
      </section>
    </main>
  </body>
</html>
